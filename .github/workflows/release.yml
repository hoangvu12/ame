name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Carry forward skin generator bundle
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The generator bundle is built outside this repo and attached by the
          # maintainer. Carry the previous release's asset forward so fresh
          # installs always find one; skip silently on the very first release.
          gh release download --repo hoangvu12/ame --pattern "skin-generator.zip" --dir dist --clobber || \
            echo "No previous skin-generator.zip asset; attach one with: gh release upload <tag> skin-generator.zip"

      - name: Build bundled LTK runtime
        shell: pwsh
        run: |
          # runtime.zip is committed (signed LTK binaries + overlay helper,
          # hash- and signature-pinned). Rebuild it only when updating the
          # LTK revision: run tools/ltk-runtime/build.ps1 (needs Rust) and
          # commit the regenerated bundle.
          $expected = @{
            'ltk_patcher_host.exe' = 'a7c4047ce7548c7ae820bc440735f15b9d1a495acf061dbb5a5a2893a0ed8d7c'
            'ltk_patcher_dll.dll' = '07a43bf36a389eb00f6276e333bd7f2b95218f25a58e1e128ff4d2e4ab2dc99b'
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead("internal/ltk/assets/runtime.zip")
          foreach ($name in $expected.Keys) {
            $entry = $zip.GetEntry($name)
            if (-not $entry) { throw "LTK bundle missing entry: $name" }
            $stream = $entry.Open()
            $sha = [System.Security.Cryptography.SHA256]::Create()
            $hash = [BitConverter]::ToString($sha.ComputeHash($stream)).Replace("-", "").ToLowerInvariant()
            $stream.Close()
            if ($hash -ne $expected[$name]) { throw "Unexpected LTK binary: $name" }
          }
          $zip.Dispose()
          Write-Output "LTK runtime bundle verified."

      - name: Build server
        shell: bash
        run: |
          mkdir -p dist
          go mod tidy
          go build -trimpath -ldflags="-s -w -X 'main.Version=${{ steps.version.outputs.VERSION }}'" -o dist/ame.exe ./cmd/ame

      - name: Create plugin zip
        shell: bash
        run: |
          cd src
          7z a -tzip ../dist/plugin.zip *.js locales

      - name: Prepare release notes
        shell: bash
        run: |
          cat changes.md > release_notes.md
          cat >> release_notes.md << 'NOTES'

          ---

          ## Installation
          1. Download `ame.exe`
          2. Run it - everything is set up automatically on first run
          3. Open League client to use the skin selector

          ## What happens on first run
          - Installs the bundled LTK runtime
          - Downloads and installs Pengu Loader
          - Installs the ame plugin
          - Asks you to activate Pengu Loader (one-time)
          - Starts the skin changer server

          ## Usage
          - Run `ame.exe` before opening League
          - Pick a champion in champ select
          - Click "Apply Skin" to use any skin

          ## Uninstall
          Download and run `uninstall.bat` to remove ame completely.
          NOTES

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ame ${{ steps.version.outputs.VERSION }}
          body_path: ./release_notes.md
          files: |
            dist/ame.exe
            dist/plugin.zip
            dist/skin-generator.zip
            uninstall.bat
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
